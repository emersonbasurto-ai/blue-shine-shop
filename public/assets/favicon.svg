<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="navyGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#343C6E" />
      <stop offset="100%" stop-color="#23294E" />
    </radialGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#12162B" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Fondo Navy Squircle Redondeado -->
  <rect width="512" height="512" rx="112" fill="url(#navyGlow)" />

  <!-- Línea de Sombra de la Rama (Profundidad) -->
  <g transform="translate(6, 6)" opacity="0.35">
    <path d="M 256 390 C 256 310, 260 210, 268 135" stroke="#12162B" stroke-width="6" stroke-linecap="round" fill="none" />
    <!-- Hoja Superior -->
    <path d="M 268 135 C 295 160, 310 215, 266 260 C 235 210, 245 160, 268 135 Z" fill="none" stroke="#12162B" stroke-width="5" />
    <!-- Hoja Derecha 1 -->
    <path d="M 264 240 C 330 200, 395 240, 360 305 C 310 305, 275 270, 264 240 Z" fill="none" stroke="#12162B" stroke-width="5" />
    <!-- Hoja Derecha Inferior -->
    <path d="M 260 300 C 315 285, 360 330, 320 375 C 275 365, 260 330, 260 300 Z" fill="none" stroke="#12162B" stroke-width="5" />
    <!-- Hoja Izquierda 1 -->
    <path d="M 262 230 C 205 180, 150 220, 180 280 C 220 280, 250 255, 262 230 Z" fill="none" stroke="#12162B" stroke-width="5" />
    <!-- Hoja Izquierda Inferior -->
    <path d="M 258 290 C 195 280, 155 330, 195 370 C 240 360, 255 320, 258 290 Z" fill="none" stroke="#12162B" stroke-width="5" />
  </g>

  <!-- Rama Botánica Coral (#EF8A56) Principal -->
  <g filter="url(#subtleShadow)">
    <!-- Tallo Central -->
    <path d="M 256 390 C 256 310, 260 210, 268 135" stroke="#EF8A56" stroke-width="6.5" stroke-linecap="round" fill="none" />

    <!-- Hoja Superior Central -->
    <path d="M 268 135 C 295 160, 310 215, 266 260 C 235 210, 245 160, 268 135 Z" fill="none" stroke="#EF8A56" stroke-width="6" stroke-linejoin="round" />
    <path d="M 268 150 C 278 190, 272 230, 266 250" stroke="#EF8A56" stroke-width="3" fill="none" opacity="0.8" />

    <!-- Hoja Derecha Superior -->
    <path d="M 264 240 C 330 200, 395 240, 360 305 C 310 305, 275 270, 264 240 Z" fill="none" stroke="#EF8A56" stroke-width="6" stroke-linejoin="round" />
    <path d="M 275 250 C 320 245, 345 275, 350 295" stroke="#EF8A56" stroke-width="3" fill="none" opacity="0.8" />

    <!-- Hoja Derecha Inferior -->
    <path d="M 260 300 C 315 285, 360 330, 320 375 C 275 365, 260 330, 260 300 Z" fill="none" stroke="#EF8A56" stroke-width="6" stroke-linejoin="round" />
    <path d="M 270 310 C 305 315, 325 345, 315 365" stroke="#EF8A56" stroke-width="3" fill="none" opacity="0.8" />

    <!-- Hoja Izquierda Superior -->
    <path d="M 262 230 C 205 180, 150 220, 180 280 C 220 280, 250 255, 262 230 Z" fill="none" stroke="#EF8A56" stroke-width="6" stroke-linejoin="round" />
    <path d="M 250 240 C 205 235, 180 260, 185 275" stroke="#EF8A56" stroke-width="3" fill="none" opacity="0.8" />

    <!-- Hoja Izquierda Inferior -->
    <path d="M 258 290 C 195 280, 155 330, 195 370 C 240 360, 255 320, 258 290 Z" fill="none" stroke="#EF8A56" stroke-width="6" stroke-linejoin="round" />
    <path d="M 245 305 C 205 315, 185 345, 200 360" stroke="#EF8A56" stroke-width="3" fill="none" opacity="0.8" />
  </g>
</svg>
